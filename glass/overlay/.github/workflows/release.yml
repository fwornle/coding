# Generated repository — this workflow comes from coding/glass/overlay.
# A merge into main whose package.json version has no release yet publishes
# one: the npm tarball (dependencies bundled — installs offline), checked by the
# install check before it is attached. Bump the version in coding's overlay.
name: glass release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - id: version
        shell: bash
        run: |
          echo "GH_HOST=${GITHUB_SERVER_URL#https://}" >> "$GITHUB_ENV"
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - id: exists
        shell: bash
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=yes" >> "$GITHUB_OUTPUT"
          else
            echo "release=no" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.release == 'no'
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund
      - if: steps.exists.outputs.release == 'no'
        run: npm pack
      - if: steps.exists.outputs.release == 'no'
        run: node tests/install-check.mjs --tarball "glass-${{ steps.version.outputs.version }}.tgz"
      - if: steps.exists.outputs.release == 'no'
        shell: bash
        run: |
          v="${{ steps.version.outputs.version }}"
          notes="$(node -e 'const e=require("./EXTRACTED.json"); console.log(Object.entries(e.sources).map(([n,s])=>`- ${n}@${s.sha.slice(0,8)}`).join("\n"))')"
          gh release create "v$v" "glass-$v.tgz" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "glass $v" --notes "Extracted from:
          $notes

          Install: see README.md (Node >= 22.13, no build step, no registry access needed)."
