# Generated repository — this workflow comes from coding/glass/overlay.
# Daemon, interception and CLI tests on every platform glass installs on
# natively (AIMAAD has no macOS runners; macOS is checked locally), then the
# install check: pack → npm install -g (offline) → one measured run per agent →
# uninstall → HOME unchanged.
name: glass tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.13.0', '22.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --omit=dev --ignore-scripts --no-audit --no-fund
      - run: node --test "tests/**/*.test.mjs"
      - run: node tests/install-check.mjs
