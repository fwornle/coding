# glass/manifest.yaml — what scripts/glass/extract.mjs copies out of coding and
# rapid-llm-proxy into the generated glass tree (see .planning/glass.md, G2).
#
# Every file is listed explicitly. verify fails when the import closure needs a
# file that is not listed, so this list cannot silently go stale.

sources:
  coding: {}   # the checkout this manifest lives in
  proxy: {}    # lib/proxy/proxy-paths.cjs proxyDir(): RAPID_LLM_PROXY_DIR or the _work sibling

select:
  - source: coding
    files:
      # agent → proxy wiring (G1 WP6)
      - lib/agents/proxy-routing.mjs
      # token rows for traffic that bypasses the proxy, and the writer
      - lib/lsl/token/stop-adapter-registry.mjs
      - lib/lsl/token/claude-token-rows.mjs
      - lib/lsl/token/copilot-token-rows.mjs
      - lib/lsl/token/opencode-token-rows.mjs
      - lib/lsl/token/token-db.mjs
      - lib/lsl/token/reconcile.mjs
      - lib/lsl/token/task-id.mjs
      - lib/lsl/token/project-of.mjs
      - lib/lsl/adapters/claude-subagent-path.mjs
      - lib/lsl/adapters/index.mjs
      # project id of a cwd (project-of → repo-router → teams config; later seam cut)
      - lib/attribution/repo-router.mjs
      - lib/teams/config.cjs
      - lib/features/vendor/js-yaml.cjs
      # task binding for interactive sessions + capture retention
      - scripts/measurement-reconciler.mjs
      - lib/measurement/foreground-sessions.mjs
      - lib/measurement/context-turns-retention.mjs
      # the UI's per-session timeline read (lib/glass/ui-api.mjs)
      - lib/experiments/timeline-read.mjs
      # status line [N:… P:…] — coding's network probes, verdict and hysteresis
      - lib/network/location-probe.mjs
      - lib/network/location-hysteresis.mjs
      - lib/network/network-change-watcher.mjs
      # status line fields
      - lib/statusline/context-gauge.cjs
      - lib/statusline/model-limits.cjs
      - lib/statusline/clickable.cjs
      # status-line clicks on macOS: focus an open tab before opening a new one
      - lib/statusline/browser-tab.mjs
      - lib/statusline/visible-cell-width.cjs
      # data home + proxy resolver
      - lib/paths/index.mjs
      - lib/paths/data-home.cjs
      - lib/scope/resolve.cjs
      - lib/proxy/proxy-paths.cjs
      # raw-body redaction patterns (the daemon passes LLM_PROXY_REDACTION_CONFIG)
      - config/redaction/redaction-patterns.json

  - source: proxy
    to: proxy
    files:
      - proxy-bridge/measurement.mjs
      # forwarding + reads shared with server.mjs (G3 WP1–WP3)
      - proxy-bridge/anthropic-forward.mjs
      - proxy-bridge/anthropic-headers.mjs
      - proxy-bridge/openai-passthrough.mjs
      - proxy-bridge/usage-api.mjs
      - proxy-bridge/intercept.mjs
      - proxy-bridge/no-proxy.mjs
      - proxy-bridge/model-canonical.mjs
      - proxy-bridge/context-capture.mjs
      - proxy-bridge/context-turns.mjs
      - proxy-bridge/turn-identity.mjs
      - proxy-bridge/raw-bodies.mjs
      - proxy-bridge/shim-tools.mjs
      - proxy-bridge/db-open.cjs

# TypeScript compiled with the proxy's own tsc and compilerOptions (no maps, no
# declarations). The proxy's dist/ is never copied — it can be stale.
compile:
  - source: proxy
    to: proxy/dist
    rootDir: src
    files:
      - src/token-usage.ts
      - src/measurement-span.ts
      - src/usage-cache.ts
      - src/background-process.ts

# Literal replacements, each matched exactly `count` times (a mismatch fails: the
# upstream line changed). Only defaults that the environment cannot set.
rewrite:
  - file: lib/proxy/proxy-paths.cjs
    find: "path.resolve((codingMain ??= mainCheckout(CODING_CHECKOUT)), '..', '_work', 'rapid-llm-proxy')"
    replace: "path.resolve(CODING_CHECKOUT, 'proxy')"
    count: 1
  - file: lib/proxy/proxy-paths.cjs
    find: "path.resolve(codingRepo(), '..', '_work', 'rapid-llm-proxy', 'dist')"
    replace: "path.resolve(CODING_CHECKOUT, 'proxy', 'dist')"
    count: 1
  - file: lib/agents/proxy-routing.mjs
    find: "'12435'"
    replace: "'12445'"
    count: 6

# Non-literal import()/require() sites, per file, by count. Each either names the
# files it reaches (they must be in the tree) or says why glass never reaches it.
computed:
  - file: lib/proxy/proxy-paths.cjs
    sites: 1
    targets: [proxy/proxy-bridge/db-open.cjs]
  - file: lib/lsl/token/task-id.mjs
    sites: 1
    targets: [proxy/dist/measurement-span.js]
  - file: scripts/measurement-reconciler.mjs
    sites: 1
    targets: [proxy/dist/measurement-span.js]
  - file: lib/lsl/adapters/index.mjs
    sites: 1
    unreached: loadAdapter() loads LSL transcript adapters; glass only calls getAgentSearchPaths()

# Bare packages a file may name although package.json does not depend on them:
# guarded fallbacks that glass never takes.
optional:
  - file: proxy/proxy-bridge/db-open.cjs
    package: better-sqlite3
    reason: tried only when CODING_SQLITE_BACKEND is unset or 'better'; glass sets 'node'
  - file: lib/proxy/proxy-paths.cjs
    package: better-sqlite3
    reason: fallback when proxy/proxy-bridge/db-open.cjs is absent; glass ships it

forbidden:
  packages: [better-sqlite3, km-core, level, classic-level, leveldown, '@modelcontextprotocol/sdk']
  # tmux is not here: it is optional (decision 5) — lib/glass/tmux.mjs drives it when
  # it is on PATH and never needs it; nothing installs it.
  spawn: [bash, sh, zsh, python, python3]

overlay: glass/overlay

# Browser bundles, built with the source checkout's own node_modules (install the
# dashboard's dependencies first). The reduced entry reuses the dashboard's
# components; the daemon serves the output (lib/glass/ui-api.mjs).
build:
  - source: coding
    dir: integrations/system-health-dashboard
    config: glass-ui/vite.config.ts
    to: ui

# Where a tree goes, and what makes it that tree. extract.mjs --target <name> is
# required; --publish refuses a remote that is not the target's. A target's overlay
# adds files the neutral overlay does not have (a shared path would be a parallel
# copy); its rewrites run after both overlays; its deny scan must find nothing.
targets:
  bmw:
    remote: bmw.ghe.com/AIMAAD/glass
    overlay: glass/targets/bmw
  public:
    remote: github.com/fwornle/glass
    overlay: glass/targets/public
    rewrite:
      - file: README.md
        find: "- Read access to [AIMAAD/glass](https://bmw.ghe.com/AIMAAD/glass) on bmw.ghe.com.\n"
        replace: ""
        count: 1
      - file: README.md
        find: "[aimaad-glass.pages.bmw.ghe.com](https://aimaad-glass.pages.bmw.ghe.com/)"
        replace: "[fwornle.github.io/glass](https://fwornle.github.io/glass/)"
        count: 1
      - file: README.md
        find: "once: `gh auth login --hostname bmw.ghe.com`"
        replace: "once: `gh auth login`"
        count: 1
      - file: README.md
        find: "--repo bmw.ghe.com/AIMAAD/glass"
        replace: "--repo fwornle/glass"
        count: 1
      - file: README.md
        find: "https://bmw.ghe.com/AIMAAD/glass"
        replace: "https://github.com/fwornle/glass"
        count: 1
      - file: mkdocs.yml
        find: "site_url: https://aimaad-glass.pages.bmw.ghe.com/"
        replace: "site_url: https://fwornle.github.io/glass/"
        count: 1
      - file: mkdocs.yml
        find: "repo_name: AIMAAD/glass"
        replace: "repo_name: fwornle/glass"
        count: 1
      - file: mkdocs.yml
        find: "https://bmw.ghe.com/AIMAAD/glass"
        replace: "https://github.com/fwornle/glass"
        count: 2
      - file: package.json
        find: "\"license\": \"UNLICENSED\""
        replace: "\"license\": \"MIT\""
        count: 1
      - file: lib/glass/update.mjs
        find: "'bmw.ghe.com/AIMAAD/glass'"
        replace: "'github.com/fwornle/glass'"
        count: 1
      - file: lib/glass/update.mjs
        find: "(the repository is private to the enterprise host, so an\n * anonymous download is refused)"
        replace: "(it reads the\n * release list from the GitHub API)"
        count: 1
      - file: .github/workflows/ci.yml
        find: "(AIMAAD has no macOS runners; macOS is checked locally)"
        replace: "(Linux, macOS and Windows)"
        count: 1
      - file: .github/workflows/ci.yml
        find: "        os: [ubuntu-latest, windows-latest]"
        replace: "        os: [ubuntu-latest, macos-latest, windows-latest]"
        count: 1
      - file: .github/workflows/docs.yml
        find: "(https://aimaad-glass.pages.bmw.ghe.com/, visible to the organization)."
        replace: "(https://fwornle.github.io/glass/)."
        count: 1
      - file: docs/overview.md
        find: "--repo bmw.ghe.com/AIMAAD/glass"
        replace: "--repo fwornle/glass"
        count: 1
      - file: docs/getting-started.md
        find: "    Needs Node.js ≥ 22.13 and read access to\n    [AIMAAD/glass](https://bmw.ghe.com/AIMAAD/glass).\n"
        replace: "    Needs Node.js ≥ 22.13.\n"
        count: 1
      - file: docs/getting-started.md
        find: "--repo bmw.ghe.com/AIMAAD/glass"
        replace: "--repo fwornle/glass"
        count: 1
      - file: docs/development.md
        find: "docs build, Wiz scans."
        replace: "docs build."
        count: 1
      - file: docs/development.md
        find: "       AIMAAD/glass."
        replace: "       fwornle/glass."
        count: 1
      - file: docs/_tiers/getting-started.deep.md
        find: "- **Read access** to [AIMAAD/glass](https://bmw.ghe.com/AIMAAD/glass) on bmw.ghe.com.\n"
        replace: ""
        count: 1
      - file: docs/_tiers/getting-started.deep.md
        find: "once: `gh auth login --hostname bmw.ghe.com`"
        replace: "once: `gh auth login`"
        count: 1
      - file: docs/_tiers/getting-started.deep.md
        find: "logged in to `bmw.ghe.com`"
        replace: "logged in to GitHub"
        count: 1
      - file: docs/_tiers/getting-started.deep.md
        find: "--repo bmw.ghe.com/AIMAAD/glass"
        replace: "--repo fwornle/glass"
        count: 1
      - file: docs/_tiers/getting-started.deep.md
        find: "https://bmw.ghe.com/AIMAAD/glass"
        replace: "https://github.com/fwornle/glass"
        count: 1
      - file: docs/_tiers/development.deep.md
        find: "| Wiz | IaC, Secret and Vulnerability scans (required by the AIMAAD org) |\n"
        replace: ""
        count: 1
      - file: docs/_tiers/development.deep.md
        find: "— Ubuntu and Windows, Node"
        replace: "— Ubuntu, macOS and Windows, Node"
        count: 1
      - file: docs/_tiers/development.deep.md
        find: "[aimaad-glass.pages.bmw.ghe.com](https://aimaad-glass.pages.bmw.ghe.com/)"
        replace: "[fwornle.github.io/glass](https://fwornle.github.io/glass/)"
        count: 1
      - file: lib/network/location-probe.mjs
        find: "process.env.HEALTH_PAC_HOST || 'muc.proxy-pac.bmwgroup.net'"
        replace: "process.env.HEALTH_PAC_HOST || ''"
        count: 1
      - file: docs/development.md
        find: "--target bmw --publish"
        replace: "--target public --publish"
        count: 1
    deny:
      - 'bmw'
      - 'aimaad'
      - 'adpnext'
      - 'EF-4\d\d'
      - '\b10\.143\.'
      - '160\.50'
      - 'proxy\.muc'
      - '\bgaia\b'
      - 'Q284340'
      - '\bwiz\b'
    allow:
      # a list of company names the redaction step masks — generic, not a BMW reference
      - file: config/redaction/redaction-patterns.json
        pattern: 'BMW\|Mercedes\|Audi'
