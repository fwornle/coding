version: 1
experiment_id: kbm-claude-run-session-title-generation
snapshot_id: smoke-spec
goal_sentence: >-
  Create a file named claude-run-session-title-generation-runbook.md at the
  repository root that diagnoses this symptom for an operator: In the Runs
  table, Claude session titles display raw leading characters of the original
  prompt instead of a concise summarized description. The file must state the
  root cause, give the exact commands to confirm it, and give the exact command
  or option that fixes it.
repeats: 3
task_class: docs
variants:
  - agent: claude
    model: claude-sonnet-4-6
    framework: straight
    env: kb-on
  - agent: claude
    model: claude-sonnet-4-6
    framework: straight
    env: kb-off
test_command: node scripts/kb-ab-assert.mjs kbm-claude-run-session-title-generation
