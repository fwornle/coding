version: 1
experiment_id: kbs-coding-services-container-codegraph
snapshot_id: smoke-spec
goal_sentence: >-
  Create a file named coding-services-container-codegraph-runbook.md at the
  repository root that diagnoses this symptom for an operator: The
  code-graph-rag MCP server fails to reach codegraph functionality when the
  container isn't running or its persisted index data is missing. The file must
  state the root cause, give the exact commands to confirm it, and give the
  exact command or option that fixes it.
repeats: 3
task_class: docs
variants:
  - agent: claude
    model: claude-sonnet-4-6
    framework: straight
    env: kb-on
  - agent: claude
    model: claude-sonnet-4-6
    framework: straight
    env: kb-off
test_command: node scripts/kb-ab-assert.mjs kbs-coding-services-container-codegraph
