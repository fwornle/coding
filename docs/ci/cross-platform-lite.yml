# Cross-platform "lite" CI for the coding tools installer + test suite.
#
# STATUS: ready-to-enable, NOT yet active. To turn it on, copy this file to
#   .github/workflows/cross-platform-lite.yml
# on the PUBLIC remote (github.com/fwornle/coding) — GitHub's hosted runners
# provide real ubuntu / macOS / Windows machines.
#
# WHAT IT PROVES (the "lite" contract):
#   - every tracked shell script is syntactically valid bash on all 3 OSes;
#   - install.sh detects the OS and its unattended (--ci) gates warn-and-continue
#     instead of aborting when infra (deps / agent CLI) is absent;
#   - test-coding.sh --ci runs end-to-end and exits 0 on all 3 OSes, treating
#     unsatisfied environment checks as non-fatal [CI-SKIP].
#
# WHAT IT DOES NOT PROVE: a full working stack. That needs Docker, an
# authenticated agent CLI (claude / gh copilot), and the private submodules —
# none of which exist on public hosted runners. For full-stack CI, register
# self-hosted runners and run `install.sh --yes` + `test-coding.sh`.

name: cross-platform-lite

on:
  workflow_dispatch: {}     # manual trigger only, to start
  # push:                   # ← uncomment once you're happy with it
  #   branches: [ main ]
  # pull_request: {}

jobs:
  portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash          # Windows runs these under Git-Bash — scripts are bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false  # lite: private submodules aren't reachable here

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax gate — bash -n on every tracked shell script
        run: |
          fail=0
          while IFS= read -r f; do
            if ! bash -n "$f"; then echo "SYNTAX ERROR: $f"; fail=1; fi
          done < <(git ls-files '*.sh')
          exit $fail

      - name: install.sh — help, OS detection, and unattended gate behaviour
        run: |
          set -e
          bash install.sh --help >/dev/null
          # Source the installer (main() is guarded, so it does NOT install) and
          # exercise the CI-lite gates: they must warn + continue, never exit,
          # when core deps / agent CLI are missing.
          source ./install.sh
          detect_platform
          echo "Detected PLATFORM=$PLATFORM"
          [ -n "$PLATFORM" ] || { echo "OS detection failed"; exit 1; }
          ( CI_LITE=true; NON_INTERACTIVE=true; check_dependencies ) \
            || { echo "check_dependencies exited under CI_LITE"; exit 1; }
          ( CI_LITE=true; NON_INTERACTIVE=true; detect_agents ) \
            || { echo "detect_agents exited under CI_LITE"; exit 1; }
          echo "✅ unattended gates warn-and-continue on $PLATFORM"

      - name: test-coding.sh --ci — full suite, unsatisfied checks are non-fatal
        run: bash scripts/test-coding.sh --ci
