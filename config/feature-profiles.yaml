# Named feature presets.
#
# A profile lists what is ON. Everything it omits is OFF — stating only the
# positives is what keeps a preset readable, and it means a newly added feature
# does not silently switch itself on in every profile.
#
# Select one with:
#   coding-features profile <name>
# which writes `profile: <name>` into ~/.coding/features.yaml. Individual
# features can then be refined on top:
#
#   profile: harness
#   features:
#     lsl: on
#
# The four TIERS are what ./install.sh offers, each a superset of the last:
#   harness → learning → learning-perf → everything
# `full` is the developer profile (everything + lsl-redirect) and is never
# offered by the installer. `minimal` is the empty baseline that
# `--features=a,b` builds on. Entries with `alias:` are retired names that still
# resolve, to their target's set, so an old features.yaml keeps working; they
# are never listed as a choice.
#
# The built-in defaults (lib/features/catalogue.cjs) are all-on and are what
# apply when no profile and no features.yaml exist anywhere.
#
# See docs/architecture/features.md for the feature -> artifact matrix.

profiles:
  # ── the four install tiers ────────────────────────────────────────────────
  #
  # None of them names `lsl-redirect`. It files turns it judges to be "about
  # the toolchain" into the tools repo instead of the project you are working
  # in — useful only to someone developing this toolchain, and for a team using
  # it, it silently moves their own sessions out of their own project. A
  # profile turns OFF everything it does not name, so not listing it is the
  # whole gate.
  harness:
    description: >-
      The agent launcher, status line, health monitoring (coordinator +
      dashboard) and the LLM proxy with token measurement. No Docker.
    features:
      llm-proxy: on
      health: on
      statusline: on

  learning:
    description: >-
      harness + session logging (LSL), online learning (observations, digests,
      insights), UKB batch learning and the knowledge viewer. Needs Docker.
    features:
      llm-proxy: on
      health: on
      statusline: on
      lsl: on
      observations: on
      knowledge: on

  learning-perf:
    description: >-
      learning + performance measurement (per-task measurement, benchmarks).
      Needs Docker.
    features:
      llm-proxy: on
      health: on
      statusline: on
      lsl: on
      observations: on
      knowledge: on
      performance: on

  everything:
    description: >-
      learning-perf + constraints (guardrails) + the code graph (graphify).
      Needs Docker.
    features:
      llm-proxy: on
      health: on
      statusline: on
      lsl: on
      observations: on
      knowledge: on
      performance: on
      constraints: on
      codegraph: on

  # ── developer ─────────────────────────────────────────────────────────────
  full:
    description: >-
      Developer profile — everything, plus lsl-redirect (toolchain turns are
      filed into this checkout). For developing coding itself; never offered
      by the installer.
    features:
      lsl: on
      lsl-redirect: on
      observations: on
      knowledge: on
      codegraph: on
      constraints: on
      llm-proxy: on
      performance: on
      health: on
      statusline: on

  # ── baseline ──────────────────────────────────────────────────────────────
  minimal:
    description: >-
      The agent launcher and a status line; no background services. The
      baseline `--features=a,b` builds on.
    features:
      statusline: on

  # ── retired names ─────────────────────────────────────────────────────────
  km:
    alias: learning
  km-perf:
    alias: learning-perf
  proxy-only:
    alias: harness
  # Kept LSL, so it maps up to learning (which needs Docker) rather than down to
  # harness: a launcher that asks for Docker is loud, losing session logging is
  # silent.
  logging-only:
    alias: learning
