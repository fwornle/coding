# Named feature presets.
#
# A profile lists what is ON. Everything it omits is OFF — stating only the
# positives is what keeps a preset readable, and it means a newly added feature
# does not silently switch itself on in every profile.
#
# Select one with:
#   coding-features profile <name>
# which writes `profile: <name>` into ~/.coding/features.yaml. Individual
# features can then be refined on top:
#
#   profile: proxy-only
#   features:
#     lsl: on
#
# The built-in defaults (lib/features/catalogue.cjs) are all-on and are what
# apply when no profile and no features.yaml exist anywhere — so an install that
# never touches this file behaves exactly as it always has.
#
# See docs/architecture/features.md for the feature -> artifact matrix.

profiles:
  full:
    description: Everything. The default.
    features:
      lsl: on
      lsl-redirect: on
      observations: on
      knowledge: on
      codegraph: on
      constraints: on
      llm-proxy: on
      performance: on
      health: on
      statusline: on

  # The two consumer bundles. Both deliberately omit `lsl-redirect`, `codegraph`
  # and `constraints`.
  #
  # `lsl-redirect` is the one that matters and the omission is the point: it
  # files turns it judges to be "about the toolchain" into the tools repo instead
  # of the project you are working in. That is useful only to someone developing
  # this toolchain. For a team using it, it silently moves their own sessions out
  # of their own scope. Because a profile turns OFF everything it does not name,
  # simply not listing it here is the whole gate — there is no separate opt-out
  # to remember.
  km:
    description: >-
      Knowledge management only — session logging, the observation pipeline and
      the knowledge base, scoped to YOUR project. No code graph, no guardrails,
      no LLM proxy. Needs Docker.
    features:
      lsl: on
      observations: on
      knowledge: on
      health: on
      statusline: on

  km-perf:
    description: >-
      Knowledge management plus performance measurement — everything in `km`,
      plus the LLM proxy's provider routing and token accounting, and the
      per-task measurement and benchmark surfaces. Needs Docker.
    features:
      lsl: on
      observations: on
      knowledge: on
      llm-proxy: on
      performance: on
      health: on
      statusline: on

  proxy-only:
    description: >-
      Just the LLM proxy — provider routing, fallback and token accounting.
      No Docker, no logging, no knowledge base.
    features:
      llm-proxy: on
      statusline: on

  logging-only:
    description: >-
      Verbatim session logging and health monitoring, without the observation
      pipeline, knowledge base or guardrails.
    features:
      lsl: on
      health: on
      statusline: on

  minimal:
    description: >-
      The agent launcher and nothing else. Bare `coding --claude` with a status
      line; no background services at all.
    features:
      statusline: on
