# config/experiments/kb-ab-etm-crashloop.yaml — knowledge-injection A/B, task 1 of 3.
#
# WHAT THIS MEASURES. Whether the ~1000 injected tokens actually help. The `env` axis carries
# the reserved values `kb-on` / `kb-off` (experiment-spec.mjs): `kb-off` sets
# CODING_KNOWLEDGE_INJECTION=0 in the agent's child env so BOTH injection seams hard-off, while
# `kb-on` fetches the GATED knowledge (obs-api /api/retrieve — IDF floor + LLM relevance judge,
# fail-CLOSED for cells) and appends it via `claude --append-system-prompt`.
#
# WHY NOT FIZZBUZZ. config/experiments/compare-fizzbuzz-kbon.yaml is a single-cell plumbing
# proof whose CORRECT outcome is that nothing is injected (the floor + judge reject every
# irrelevant match). It cannot measure benefit — you cannot detect an effect from a task where
# the treatment is designed to be a no-op. These three specs instead use goals whose ANSWER is
# accumulated project know-how: causal stories that live in the KB, not in the code.
#
# WHY A DOC AND NOT AN ANALYSIS QUESTION. Two hard constraints:
#   1. isTrivialRun (consequential-events.mjs, TRIVIAL_THRESHOLD=1) short-circuits any run with
#      no state-changing tool call BEFORE the judge is paid for — a "reply in 3 sentences" goal
#      would never be scored at all.
#   2. Headless agents narrate-then-yield on ANALYSIS-shaped goals (opencode `run` ends at the
#      first toolless step). An EXECUTION-shaped goal ("create this file") avoids both.
#
# THIS IS THE DELIBERATE WEAK TASK — READ THIS BEFORE INTERPRETING ITS RESULT. Its facts (the
# km-core symlink path, the `ln -s` fix, the launchctl check, the green-health explanation) all
# predate the snapshot's 2026-07-20 content lineage, so ALL of them are grep-able from the tree:
# scripts/experiment-audit-recoverability.mjs reports 0 of 4 required facts out of reach, verdict
# FAIL. That cannot be fixed by choosing a different string — it is a property of when the facts
# entered the repo, not of how they are graded.
#
# It is kept anyway, on the reasoning the original spec set already applied to the proxy task:
# three tasks that all favour the treatment would not tell you whether you are measuring an effect
# or your own task design. This one is the control that should show NO kb-on advantage. If it
# does show one, suspect the harness — not the knowledge. (Measured 2026-08-23: under full
# isolation it DOES show one — 4.00/4 vs 1.33/4 — and the harness was not at fault. All four
# facts are grep-able from the tree, yet kb-off spent 123 tool calls across three cells and
# never found the symlink path or the fix command. Grep-able is not the same as recoverable, so
# this spec is no longer a null control; it discriminates.) Its sibling spec
# kb-ab-leveldb-amplification also discriminates and grades on facts that landed AFTER the
# snapshot. A third sibling, kb-ab-llm-routing, was RETIRED 2026-08-23 — see the retirement note
# in lib/experiments/kb-ab-facts.mjs for why re-picking its facts could not rescue it.
#
# HOW IT IS GRADED. `test_command` is spawned as a FIXED ARGV — evidence-harness.mjs rejects any
# command carrying shell metacharacters rather than running it under a shell. The gate used to be
# a single `grep -q -F` for the symlink path; it is now `node scripts/kb-ab-assert.mjs <topic>`
# (still fixed argv), asserting a CONJUNCTION declared in lib/experiments/kb-ab-facts.mjs. One
# token could not distinguish diagnosing the cause from giving the fix — every cell of the
# 2026-08-22 run passed the old gate while differing sharply in what it actually explained.
# The underlying failure is still that `node_modules/@fwornle/km-core` (a hand-made symlink
# present in NO package.json, so `npm install` never restores it) has gone missing.
# The judge scores the remaining four rubric dimensions from the diff.
#
# PRE-FLIGHT STATUS (re-check before trusting a run). When these specs were first written the
# treatment arm was hollow: `summary_preview` was truncated to 200 chars at INDEX time, so the
# injected block named a relevant insight and stopped mid-sentence, and the graded fact was absent
# for two of the three tasks. A null result would then have read as "injection does not help"
# rather than "injection delivered 200 chars". That is fixed — SUMMARY_PREVIEW_CHARS is 1200
# (src/embedding/preview.ts) and the index was rebuilt — and probing live retrieval with each
# goal_sentence now finds the graded string in all three blocks, at 587-675 of the 1000-token
# budget (was 63-185). Re-run that probe if the KB or the constant changes again:
#   curl -s localhost:12436/api/retrieve -H 'Content-Type: application/json' \
#     -d '{"query":"<goal_sentence>","task_id":"probe--x--r0"}' | jq -r .markdown
#
# READ BOTH NUMBERS. Correctness may well tie — a kb-off agent can grep its way there eventually.
# The effect is as likely to appear in tokens and wall-clock (reaching the same answer cheaper) as
# in the score, and the runs table carries both.
#
# RUN STANDALONE. There is ONE global active-measurement.json span slot and a shared host proxy,
# so any concurrent LLM call in this repo while a cell is open is mis-stamped with that cell's
# task_id. Do NOT run this from an interactive agent session in this repo:
#   node scripts/experiment-run.mjs --spec config/experiments/kb-ab-etm-crashloop.yaml
version: 1

experiment_id: kb-ab-etm-crashloop

snapshot_id: smoke-spec

goal_sentence: "Create a file named etm-crashloop-runbook.md at the repository root that diagnoses this symptom for an operator: the tmux statusline shows [LSL red] and the project's agent letter turns yellow, while the Health API at port 3033 still reports every service green. The file must state the root cause, give the exact shell commands to confirm it, and give the exact command that fixes it."

repeats: 3

# Closed-taxonomy class — an unclassified run quarantines as pending and is EXCLUDED from the
# default dashboard runs query, i.e. it completes invisibly.
task_class: docs

# Fixed argv, no shell metacharacters (evidence-harness.mjs would reject those → ungated run).
# `-F` keeps the pattern literal so the '@' and '/' are not regex-interpreted.
test_command: "node scripts/kb-ab-assert.mjs kb-ab-etm-crashloop"

# The ONLY axis is injection. Same agent, same pinned model, same framework on both arms, so any
# difference is attributable to the injected knowledge and nothing else.
# Model PINNED to claude-sonnet-4-6, never the `sonnet` alias: the alias tracks the CLI's latest
# Sonnet, so it would silently change model mid-matrix and break arm-to-arm parity.
variants:
  - agent: claude
    model: claude-sonnet-4-6
    framework: straight
    env: kb-on
  - agent: claude
    model: claude-sonnet-4-6
    framework: straight
    env: kb-off
