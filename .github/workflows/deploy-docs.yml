name: Deploy Documentation

# Trigger on every push to main and on manual dispatch. The first job (`gate`)
# inspects the actual git diff and decides whether `build` + `deploy` should
# run. The old top-level `paths:` filter was unreliable because GitHub
# truncates the PushEvent commits array at 20 commits — when more than that
# arrives in a single push (a multi-day local backlog, for example), the
# filter cannot find the matching path and silently skips the workflow,
# so docs-content changes never deployed (see the 2026-05-25 incident:
# 84-commit push containing 8685ef2e2 went un-built).
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # gate — decide whether the push actually touched docs paths.
  # Uses `git diff` against `github.event.before` (the pre-push tip) so
  # it works for any push size, unlike the top-level `paths:` filter.
  # workflow_dispatch always builds.
  # ---------------------------------------------------------------------
  gate:
    runs-on: ubuntu-latest
    outputs:
      docs-changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether docs paths changed
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch — building unconditionally"
            exit 0
          fi
          BASE="${{ github.event.before }}"
          # Initial push / force-push / unrelated history → compare to HEAD~1.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi
          # If BASE isn't reachable (e.g. force-push), fall back too.
          if ! git rev-parse --verify --quiet "$BASE^{commit}" >/dev/null; then
            echo "BASE $BASE not reachable; falling back to HEAD~1"
            BASE="HEAD~1"
          fi
          echo "Comparing $BASE..HEAD"
          CHANGED_PATHS=$(git diff --name-only "$BASE" HEAD || true)
          echo "Files changed in push:"
          echo "$CHANGED_PATHS" | sed 's/^/  /'
          # `docs/` is in this pattern, and it is not redundant with `docs-content/`.
          #
          # Several files under docs-content/ are SYMLINKS into docs/ — e.g.
          # docs-content/benchmarks/coding-v1/RESULTS.md -> ../../../docs/benchmarks/coding-v1/RESULTS.md.
          # Updating one changes the symlink's TARGET, not the symlink, so `git diff
          # --name-only` reports only the docs/ path and a docs-content-only pattern does not
          # match. The site then keeps serving the old page while the workflow reports
          # SUCCESS, because the gate succeeds and build/deploy are merely skipped:
          #
          #     gate: success   build: skipped   deploy: skipped
          #
          # That is how the 2026-08-19 coding-v1 benchmark report was published to the repo
          # and never reached https://fwornle.github.io/coding — five consecutive green runs,
          # ~25s each, none of which ran mkdocs. A silent no-op that reports success is worse
          # than a failure, so the gate now errs toward building.
          #
          # Cost of the widening: pushes that touch docs/ but render nothing now rebuild.
          # docs/ is documentation by definition and a build is ~30s, so this is cheap
          # insurance against a failure mode that is invisible by construction.
          if echo "$CHANGED_PATHS" | grep -qE '^(docs/|docs-content/|mkdocs\.yml$|\.github/workflows/deploy-docs\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Docs-relevant paths detected — will build"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No docs-relevant paths in this push — skipping build"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.docs-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-docs.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install mkdocs-material mkdocs-minify-plugin

      - name: Build documentation
        run: mkdocs build --strict

      # Publish the content hash of what was just built, so a later run can ask the LIVE
      # SITE what it is serving instead of inferring it from the gate. See the `freshness`
      # job — this file is the only thing that makes that check possible.
      - name: Stamp the docs manifest into the site
        run: |
          scripts/docs-manifest.sh > site/.docs-manifest
          echo "published manifest: $(cat site/.docs-manifest)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  # ---------------------------------------------------------------------
  # freshness — the guard for a WRONG GATE.
  #
  # The gate skipping is normal: most pushes are code-only and must not rebuild. What is
  # not normal is the gate skipping while the site is actually stale, and that failure is
  # invisible by construction — `build: skipped` reports the whole run as SUCCESS, so
  # nothing anywhere says the published site no longer matches main.
  #
  # It has already happened. docs-content/benchmarks/coding-v1/RESULTS.md is a symlink into
  # docs/, so publishing a benchmark report changed the symlink's TARGET and not the
  # symlink; the gate matched only `docs-content/` and skipped. Five consecutive green runs
  # on 2026-08-19, ~25s each, none of which ran mkdocs, and the coding-v1 report never
  # reached the site. Yesterday's image-link fix had gone the same way unnoticed.
  #
  # Widening the gate fixed that instance. This job exists because the NEXT wrong gate would
  # be just as silent — so rather than trust the pattern, it checks the invariant directly:
  # the content hash of everything mkdocs renders (symlinks resolved) must equal the hash
  # the live site is serving. It is independent of the gate's pattern by design; if the two
  # ever disagree, this fails loudly and names the fix.
  #
  # Asymmetric on purpose: FAIL only on positive evidence of staleness (a hash mismatch).
  # If the manifest cannot be fetched — first run after this change, Pages not yet live, a
  # network blip — warn and pass. A guard that goes red on its own infrastructure gets
  # disabled, and then protects nothing.
  # ---------------------------------------------------------------------
  freshness:
    needs: gate
    if: needs.gate.outputs.docs-changed == 'false' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Does the live site still match main?
        env:
          SITE_URL: https://fwornle.github.io/coding
        run: |
          set -uo pipefail
          LOCAL="$(scripts/docs-manifest.sh)"
          echo "main renders:  $LOCAL"

          LIVE=""
          for attempt in 1 2 3; do
            LIVE=$(curl -fsSL --max-time 30 "$SITE_URL/.docs-manifest" 2>/dev/null | tr -d '[:space:]') && break
            echo "attempt $attempt: could not fetch the live manifest"
            LIVE=""
            sleep 5
          done

          if [ -z "$LIVE" ]; then
            echo "::warning::Could not read $SITE_URL/.docs-manifest — cannot verify freshness."
            echo "Expected on the first run after this guard was added (the file only exists"
            echo "once a build has published it). Passing rather than failing on a check that"
            echo "could not run; a guard that goes red on its own infrastructure gets disabled."
            exit 0
          fi

          echo "site serves:   $LIVE"
          if [ "$LOCAL" = "$LIVE" ]; then
            echo "Site matches main. The skip was correct."
            exit 0
          fi

          echo "::error::The docs gate SKIPPED the build, but the live site does not match main."
          cat <<'MSG'

          The published site is STALE and nothing else would have told you.

          What this means: this push changed something mkdocs renders, and the gate's path
          pattern did not recognise it — the same class of bug as the symlink case this
          guard was written for (docs-content/**/RESULTS.md -> docs/**/RESULTS.md).

          Fix, in order:
            1. Publish the current docs now:
                 gh workflow run deploy-docs.yml --ref main
            2. Work out which path the gate missed, and widen the pattern in the `gate` job.
               Compare what changed against the pattern:
                 git diff --name-only HEAD~1 HEAD
            3. If it was another symlink, prefer widening to the whole source directory over
               enumerating individual files — an enumeration has to be maintained, and
               forgetting to extend it fails exactly this silently.
          MSG
          exit 1

  deploy:
    needs: [gate, build]
    if: needs.gate.outputs.docs-changed == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
