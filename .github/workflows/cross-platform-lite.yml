# Cross-platform CI for the coding tools installer + test suite.
#
# Runs on GitHub's hosted ubuntu / macOS / Windows runners. It proves the shell
# scripts are PORTABLE and degrade gracefully, that --dry-run is inert, and that
# a real install completes on Linux. It does NOT prove a full working stack
# (that needs Docker, an authenticated agent CLI, and the private submodules;
# use self-hosted runners for that). See docs/ci/README.md.

name: cross-platform-lite

on:
  pull_request: {}
  workflow_dispatch: {}
  # push:
  #   branches: [ main ]   # ← uncomment to also run on every push to main

jobs:
  portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash          # Windows runs these under Git-Bash — scripts are bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false  # lite: private submodules aren't reachable here

      - uses: actions/setup-node@v4
        with:
          # 22 to match docker/Dockerfile.coding-services (node:22-bookworm).
          # Testing on 20 while shipping on 22 is testing a different runtime.
          node-version: '22'

      - name: Syntax gate — bash -n on every tracked shell script
        run: |
          fail=0
          while IFS= read -r f; do
            if ! bash -n "$f"; then echo "SYNTAX ERROR: $f"; fail=1; fi
          done < <(git ls-files '*.sh')
          exit $fail

      - name: install.sh — help, OS detection, and unattended gate behaviour
        run: |
          set -e
          bash install.sh --help >/dev/null
          # Source the installer (main() is guarded, so it does NOT install) and
          # exercise the CI-lite gates: they must warn + continue, never exit,
          # when core deps / agent CLI are missing.
          source ./install.sh
          detect_platform
          echo "Detected PLATFORM=$PLATFORM"
          [ -n "$PLATFORM" ] || { echo "OS detection failed"; exit 1; }
          ( CI_LITE=true; NON_INTERACTIVE=true; check_dependencies ) \
            || { echo "check_dependencies exited under CI_LITE"; exit 1; }
          ( CI_LITE=true; NON_INTERACTIVE=true; detect_agents ) \
            || { echo "detect_agents exited under CI_LITE"; exit 1; }
          echo "unattended gates warn-and-continue on $PLATFORM"

      - name: test-coding.sh --ci — full suite, unsatisfied checks are non-fatal
        run: bash scripts/test-coding.sh --ci

  # ───────────────────────────────────────────────────────────────────────────
  # The daemon backends.
  #
  # lib/features/daemons.mjs speaks launchd, systemd --user and Task Scheduler,
  # and for a while only launchd had ever run: the other two were shipped and
  # unverified, where a wrong flag would have surfaced as "the toggle did
  # nothing" on a machine none of us was sitting at.
  #
  # Two tiers, deliberately:
  #
  #   contract  — asserts the exact command lines and the parsing of real
  #               command output, with the executor substituted. Runs on all
  #               three OSes, so a Linux regression is caught on a Mac. This is
  #               the HARD gate.
  #   live      — creates a real unit and drives install → start → observe →
  #               stop → observe against the actual service manager. Catches a
  #               command that is right on paper and rejected in practice.
  #
  # The live tier exits 0 when the runner cannot host a user service (a bare
  # GitHub runner often has no systemd --user session bus). That is an
  # environment fact rather than a defect, the reason is always printed, and the
  # contract tier still gates the PR — so a skip never means "unchecked".
  # ───────────────────────────────────────────────────────────────────────────
  daemon-backends:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # js-yaml is the resolver's only runtime dependency. `npm ci` here would
      # pull the whole tree (and its native postinstalls) for two test files.
      - name: Minimal dependencies
        run: npm install --no-save --ignore-scripts js-yaml

      - name: Contract tests — all three backends, on every OS
        run: node --test tests/features/daemon-backends.test.mjs

      # Give the Linux runner a user systemd instance if it can have one.
      # Without lingering there is no user manager for a non-login session, and
      # `systemctl --user` fails with "Failed to connect to bus" — which the
      # live script detects and reports rather than mistaking for our bug.
      - name: Enable a user systemd session (linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo loginctl enable-linger "$USER" || true
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"

      - name: Report service-manager capability
        run: node scripts/test-daemon-backend.mjs --probe

      - name: Live round-trip against the real service manager
        run: node scripts/test-daemon-backend.mjs

      # The live script always cleans up, including on failure. This asserts it
      # actually did: a test that leaves a unit behind would make the NEXT run
      # pass for the wrong reason.
      - name: No test unit left behind
        if: always()
        run: |
          leftover=0
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            [ -f "$HOME/.config/systemd/user/lsl-lock-sweeper.service" ] && leftover=1
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            schtasks //Query //TN "\\coding\\lsl-lock-sweeper" >/dev/null 2>&1 && leftover=1
          fi
          if [ "$leftover" = "1" ]; then
            echo "::error::the live test left its unit installed"
            exit 1
          fi
          echo "no leftover unit"

  # ───────────────────────────────────────────────────────────────────────────
  # --dry-run must be exactly as inert as it claims.
  #
  # This is cheap and catches a specific, plausible regression: someone adds a
  # mutation ABOVE the dry-run exit, or writes the install log before it, and
  # the flag quietly stops being a safe way to inspect the installer. Asserting
  # "exit 0" alone would not notice either.
  # ───────────────────────────────────────────────────────────────────────────
  dry-run-is-inert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Snapshot the working tree and the paths the installer can touch
        run: |
          set -e
          git status --porcelain > /tmp/tree-before.txt
          # Timestamp floor for the sweep. Sleep 1s so files written during the
          # run are strictly newer than the marker rather than sharing its
          # second and being missed.
          sleep 1
          touch /tmp/home-marker
          sleep 1

      - name: ./install.sh --ci --dry-run
        run: |
          set -e
          ./install.sh --ci --dry-run | tee /tmp/dry-run.txt
          echo "exit=0 as required"

      - name: Assert nothing was mutated
        run: |
          set -e
          fail=0

          git status --porcelain > /tmp/tree-after.txt
          if ! diff -u /tmp/tree-before.txt /tmp/tree-after.txt; then
            echo "::error::--dry-run modified the working tree"
            fail=1
          fi

          # install.log in particular: writing it would contradict the promise.
          if [ -f install.log ]; then
            echo "::error::--dry-run created install.log"
            fail=1
          fi

          # Only the paths install.sh can actually touch, per its own mutation
          # manifest, plus the shell rc files.
          #
          # NOT a blanket `find $HOME`: on a GitHub runner $HOME is /home/runner,
          # and the runner's own bookkeeping lives underneath it — work/_temp/*.sh
          # (the very script running this step), _runner_file_commands/*,
          # actions-runner/*/_diag/*. A whole-$HOME sweep is therefore non-empty
          # on every run no matter what the installer does, so it reported a
          # violation that was pure runner noise. Enumerating the real targets
          # states the intent instead of trying to out-guess runner internals.
          : > /tmp/home-touched.txt
          for p in "$HOME/.claude" "$HOME/.claude.json" "$HOME/.copilot" \
                   "$HOME/.config/opencode" "$HOME/.opencode" "$HOME/bin" \
                   "$HOME/.bashrc" "$HOME/.bash_profile" "$HOME/.zshrc" \
                   "$HOME/.zprofile" "$HOME/.config/systemd/user" "$HOME/.npmrc"; do
            [ -e "$p" ] || continue
            find "$p" -newer /tmp/home-marker -print 2>/dev/null >> /tmp/home-touched.txt || true
          done
          if [ -s /tmp/home-touched.txt ]; then
            echo "::error::--dry-run wrote to a path in the mutation manifest:"
            cat /tmp/home-touched.txt
            fail=1
          fi

          # And it must actually have PRINTED the manifest, otherwise a
          # do-nothing stub would pass every assertion above.
          grep -q "WHAT THIS INSTALLER WILL CHANGE" /tmp/dry-run.txt \
            || { echo "::error::--dry-run did not print the mutation manifest"; fail=1; }

          exit $fail

  # ───────────────────────────────────────────────────────────────────────────
  # A real install. This is the job whose absence hid the original failure.
  #
  # The old CI only SOURCED install.sh and called detect_platform /
  # check_dependencies / detect_agents, so install_node_dependencies was
  # unreachable on every OS and the npm and proxy paths were never executed
  # anywhere. Sourcing also leaves `set -euo pipefail` inactive, so it tested
  # different shell semantics than a real run.
  #
  # ubuntu-latest only: this needs a throwaway machine. It is allowed to end
  # with warnings (no Docker daemon, no agent CLI, no private submodules) —
  # --ci downgrades those to warnings by design. What it must not do is abort,
  # leave `coding` unusable, or touch shared agent config.
  # ───────────────────────────────────────────────────────────────────────────
  real-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Hash shared agent configs before the install
        run: |
          set -e
          # The requirement-7 invariant, asserted around a REAL install rather
          # than around the seven functions in isolation (test-coding.sh does
          # the function-level form; this is the end-to-end one).
          hash_one() {
            if [ -f "$1" ]; then sha256sum < "$1" | awk '{print $1}'
            elif [ -d "$1" ]; then (cd "$1" && find . -type f -print0 | sort -z | xargs -0 sha256sum 2>/dev/null | sha256sum | awk '{print $1}')
            else echo ABSENT; fi
          }
          : > /tmp/r7-before.txt
          for p in "$HOME/.claude/settings.json" "$HOME/.claude.json" \
                   "$HOME/.claude/commands" "$HOME/.copilot/settings.json" \
                   "$HOME/.copilot/config.json" \
                   "$HOME/.config/opencode/opencode.json" "$HOME/.opencode/plugins"; do
            echo "$p $(hash_one "$p")" >> /tmp/r7-before.txt
          done
          cat /tmp/r7-before.txt

      - name: ./install.sh --ci
        timeout-minutes: 25
        run: |
          set -e
          # tee: the npm assertion below needs the output, and --ci deliberately
          # downgrades failures so exit status alone no longer proves much.
          ./install.sh --ci 2>&1 | tee /tmp/install-ci.log
          echo "installer exit=${PIPESTATUS[0]}"

      - name: npm dependency install must have SUCCEEDED
        run: |
          set -e
          # --ci downgrades an npm failure to a warning so the run can reach its
          # summary. That is right for the installer and wrong for this job: a
          # broken npm phase would otherwise sail through as exit 0. Assert the
          # success line directly, the way scripts/test-install-linux.sh does.
          # Key on the message emitted AT THE MOMENT OF FAILURE, not the summary
          # line: the summary only appears if the run reaches the end, so a later
          # abort would leave this check matching nothing and reporting the wrong
          # reason. This pattern covers both the fatal and the --ci-downgraded
          # wording, since both contain it.
          if grep -q "Failed to install Node.js dependencies" /tmp/install-ci.log; then
            echo "::error::npm dependency install FAILED (downgraded by --ci, caught here)"
            grep -E "npm error|npm ERR" /tmp/install-ci.log | tail -20 || true
            exit 1
          fi
          grep -q "Node.js dependencies installed" /tmp/install-ci.log \
            || { echo "::error::no evidence the npm phase ran at all"; exit 1; }
          echo "npm phase confirmed successful"

      - name: bin/coding --help must work afterwards
        run: |
          set -e
          test -x bin/coding || { echo "::error::bin/coding is not executable"; exit 1; }
          bash bin/coding --help >/dev/null \
            || { echo "::error::bin/coding --help failed after a real install"; exit 1; }
          echo "bin/coding --help OK"

      - name: Requirement 7 — shared agent configs still byte-identical
        run: |
          set -e
          hash_one() {
            if [ -f "$1" ]; then sha256sum < "$1" | awk '{print $1}'
            elif [ -d "$1" ]; then (cd "$1" && find . -type f -print0 | sort -z | xargs -0 sha256sum 2>/dev/null | sha256sum | awk '{print $1}')
            else echo ABSENT; fi
          }
          fail=0
          while read -r p before; do
            after="$(hash_one "$p")"
            if [ "$before" != "$after" ]; then
              echo "::error::a default install changed $p ($before -> $after)"
              fail=1
            fi
          done < /tmp/r7-before.txt
          if [ $fail -eq 0 ]; then
            echo "all 7 shared agent configs unchanged by a real install"
          fi
          exit $fail

      - name: Installer summary (always shown, for diagnosis)
        if: always()
        run: tail -60 install.log 2>/dev/null || echo "(no install.log)"
